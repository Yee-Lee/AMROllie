scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: range_filter
      type: laser_filters/LaserScanRangeFilter
      params:
        use_message_range_limits: false
        lower_threshold: 0.16  # 濾除小於 16cm (0.16m) 的資料
        upper_threshold: 12.0  # LD19 的最大測距約為 12m
        lower_replacement_value: .nan # 將小於 16cm 的點設為無效值 (NaN)
        upper_replacement_value: .nan
